<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard — SA</title>
  <link rel="stylesheet" href="/admin.css" />
  <link rel="stylesheet" href="/admin-premium.css" />
  <link rel="stylesheet" href="/admin-responsive.css" />
  <link rel="stylesheet" href="/admin-view-overrides.css" />
</head>
<body>
<div id="adminApp" class="admin-shell hidden">
  <aside class="sidebar">
    <a class="admin-brand" href="/">Simran Arrora <span>♡</span></a>
    <p class="side-label">ADMIN PANEL</p>
    <nav id="sideNav">
      <button data-view="dashboard" class="active">Dashboard</button><button data-view="appointments">Appointments</button><button data-view="customers">Customers</button><button data-view="services">Services</button><button data-view="configuration">Booking Configuration</button><button data-view="prices">Price Lists</button><button data-view="platforms">Platforms & Links</button><button data-view="gallery">Gallery</button><button data-view="video-platforms">Videos / Video Platforms</button><button data-view="calendar">Calendar</button><button data-view="live">Live Management</button><button data-view="payments">Payments</button><button data-view="qr">QR Management</button><button data-view="integrations">Google Integrations</button><button data-view="messages">Contact Messages</button><button data-view="documents">Legal Pages</button><button data-view="notifications">Notifications</button><button data-view="settings">Settings</button>
    </nav>
    <div class="side-bottom"><a href="/">View Website</a><button id="adminLogout">Logout</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><p class="eyebrow">CONTROL CENTER</p><h1 id="viewTitle">Dashboard</h1></div><div class="top-actions"><input class="top-search" placeholder="Search dashboard" aria-label="Search dashboard"><button class="top-icon menu-toggle" id="menuToggle" aria-label="Open navigation">☰</button><button class="top-icon" id="notificationButton" aria-label="Notifications">♡</button><div id="adminName" class="avatar"></div></div></header>
    <section id="view"></section>
  </main>
</div>
<div id="adminGate" class="gate hidden">
  <form id="adminLogin" class="login-card">
    <a class="admin-brand" href="/">Simran Arrora <span>♡</span></a><h1>Admin Sign In</h1><p>Use secure credentials or sign in with your authorized Google Admin account.</p>
    <label>Email<input id="adminEmail" type="email" required /></label><label>Password<input id="adminPassword" type="password" required /></label><button class="primary" type="submit">Sign In</button>
    <div style="margin: 14px 0 6px; text-align: center; font-size: 12px; color: var(--text-muted);">OR</div>
    <button type="button" id="adminGoogleBtn" class="google-signin-btn" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px 14px; background: #fff; color: #3c4043; border: 1px solid #dadce0; border-radius: 8px; font-weight: 500; cursor: pointer; font-size: 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign In with Google
    </button>
    <p id="loginMsg" class="muted"></p>
  </form>
</div>
<div id="adminToast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="/firebase-client.js"></script>
<script src="/admin.js"></script>
</body>
</html>
